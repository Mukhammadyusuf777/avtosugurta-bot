name = "avtosugurta-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "avtosugurta-db"
database_id = "c698c4aa-d651-4b2d-8503-665508a638dd"
migrations_dir = "migrations"

# Cron trigger for 7-day expiration notification
# Runs daily at 06:00 UTC (11:00 AM Tashkent time UTC+5)
[triggers]
crons = ["0 6 * * *"]

# Public environment variables
[vars]
TIMEZONE = "Asia/Tashkent"
DEFAULT_PAGE_SIZE = "5"

# Secrets required (set via `wrangler secret put <NAME>`):
# - TELEGRAM_BOT_TOKEN
# - ADMIN_CHAT_ID
# - SECRET_TOKEN (optional)
